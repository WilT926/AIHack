<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;">
<img src="{{ src }}" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;filter:{{ filter }};opacity:{{ opacity }};">
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;who&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:0,&quot;max&quot;:11,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;hair&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cap&quot;,&quot;bun&quot;,&quot;fringe&quot;,&quot;curls&quot;,&quot;none&quot;],&quot;default&quot;:&quot;cap&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;glasses&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;invert&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const t = v => v === true || v === 'true';
    const hair = p.hair ?? 'cap', g = t(p.glasses);
    const map = { cap: g ? 10 : 0, bun: 9, fringe: 3, curls: 1, none: g ? 6 : 4 };
    const n = p.who != null ? Number(p.who) : (map[hair] ?? 0);
    const grey = p.face && p.face !== '#ffffff';
    return {
      src: `./avatars2/a${n}.png`,
      filter: t(p.invert) ? 'invert(1)' : 'none',
      opacity: grey ? 0.5 : 1
    };
  }
}
</script>
</body>
</html>
